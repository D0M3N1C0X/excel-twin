# Publishes to PyPI with trusted publishing (no token stored in the repository).
# One-time setup on pypi.org: add a pending publisher for project "excel-twin", owner D0M3N1C0X,
# repository excel-twin, workflow release.yml, environment pypi. Then run this workflow by hand.
name: release

on:
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests pass before anything is published
        run: pip install -e ".[test]" && pytest -q
      - name: The tag, if any, matches the version
        run: |
          v=$(python -c "import excel_twin; print(excel_twin.__version__)")
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF#refs/tags/v}" != "$v" ]]; then
            echo "::error::tag ${GITHUB_REF#refs/tags/} does not match version $v"; exit 1
          fi
      - run: pip install build twine
      - run: python -m build
      - name: The packages are valid
        run: twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
