name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    # Style and likely bugs (ruff), and strict types (mypy); settings in pyproject.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[lint]"
      - run: ruff check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install ".[test]"
      - run: pytest -q --cov --cov-report=term
      - name: Coverage in the run summary
        if: matrix.python-version == '3.12'
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  libreoffice:
    # the recalculation path, against a real spreadsheet engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc
      - run: pip install ".[test]"
      - run: pytest -q -k libreoffice -rs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
